*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px 14px;max-width:480px;margin:0 auto;-webkit-font-smoothing:antialiased}
header{padding:14px 0 8px;text-align:center}
header h1{font-size:18px;font-weight:800}
header .st{font-size:11px;color:var(--sub);margin-top:2px}
.refresh-bar{padding:8px;margin:8px 0 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--sub);text-align:center;cursor:pointer}
.tabs{display:flex;gap:3px;margin-bottom:12px}

.dc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;position:relative;min-height:130px}
.dc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px 0 0 2px}
.dc.l0::before{background:#2980b9}.dc.l1::before{background:#27ae60}.dc.l2::before{background:#b8860b}.dc.l3::before{background:#d35400}.dc.l4::before{background:#c0392b}

.dc-top .name{font-size:13px;font-weight:700}

.dc-p{font-size:22px;font-weight:800;line-height:1.2}
.chip{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}.chip-up{background:#fde8e8;color:var(--red)}.chip-down{background:#e8f5e9;color:var(--green)}
.adv{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.a-buy{background:#e8f5e9;color:#1e8449}.a-wait{background:#fff8e0;color:#b8860b}.a-nop{background:#f0f2f5;color:var(--sub)}
.bar-track{height:4px;background:#eef0f4;border-radius:3px;position:relative;margin-top:3px}
.bar-fill{height:100%;border-radius:3px}.bar-dot{position:absolute;width:8px;height:8px;border-radius:50%;top:-2px;transform:translateX(-50%);border:2px solid #fff}
.acc-item{border-bottom:1px solid var(--border);background:var(--card)}
.acc-head{cursor:pointer;padding:14px 4px;display:flex;align-items:center;justify-content:space-between}
.acc-head .name{font-size:15px;font-weight:700;flex:1}
.acc-head .price{font-size:18px;font-weight:800;margin:0 10px}
.acc-head .chg{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;min-width:50px;text-align:center}
.acc-head .arrow{font-size:14px;color:var(--sub);transition:.3s;min-width:20px;text-align:right}
.acc-head.open .arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:0 12px 16px}.acc-body.show{display:block}
.dl-section{margin-bottom:10px;background:var(--bg);padding:10px;border-radius:8px}
.dl-section h4{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;background:var(--card);padding:8px;border-radius:6px}
.m{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid #f8f9fb}.m .k{color:var(--sub)}.m .v{font-weight:600}
.divseg-svg{width:100%;display:block;margin:6px 0}.trend-svg{width:100%;height:90px;margin-top:6px;display:block}
.trend-legend{font-size:9px;color:var(--sub);margin-top:4px}.trend-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}

.hidden{display:none}footer{text-align:center;padding:14px 10px;font-size:10px;color:var(--sub)}
.stepper{display:inline-flex;align-items:center;gap:2px}

.stepper input{width:55px;padding:3px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px;font-weight:600}
.btn{display:block;width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}

/* ═══ 布林带 ═══ */

.boll-zone .zs{font-size:10px;color:var(--sub);margin-top:3px}
.boll-zone.warn{background:#fff8e0;border-color:#f0e0b0}

.boll-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px}
.boll-grid .bg{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 4px;text-align:center}
.boll-grid .bg .v{font-size:12px;font-weight:700}
.boll-grid .bg .k{font-size:9px;color:var(--sub);margin-top:2px}
.boll-hint{font-size:9px;color:var(--sub);margin-top:6px;line-height:1.6}
.boll-src{font-size:9px;color:var(--sub);margin-top:4px;text-align:right}
.boll-svg{width:100%;display:block;margin-top:6px}
.lg-wrap{margin-top:5px;padding-top:5px;border-top:1px dashed #e8eaf0}
.lg-top{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--sub);margin-bottom:3px}
.lg-pace{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.lg-track{position:relative;height:12px}
.lg-range{position:absolute;top:4px;left:0;right:0;height:5px;border-radius:3px;background:#e8eef7}
.lg-mid{position:absolute;top:1px;width:2px;height:11px;background:#a8b4c8}
.lg-dot{position:absolute;top:0;width:7px;height:7px;border-radius:50%;border:1.5px solid #fff;transform:translateX(-50%)}
.lg-axis{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-top:3px}
.lg-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:4px}

.lg-nums .n .v{font-size:11px;font-weight:700}
.lg-nums .n .k{font-size:8px;color:var(--sub);margin-top:1px}
</style>
</head>

  for(var i=0;i<n.length;i++){var px=pL+(i+0.5)*(cW/n.length),py=pT+cH-((n[i]-mn)/r)*cH*0.85,yr=2026-n.length+1+i;s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" fill="#2980b9"/><text x="'+px.toFixed(1)+'" y="'+(py-7)+'" font-size="8" fill="#333" text-anchor="middle" font-weight="700">Y'+n[i].toFixed(2)+'</text><text x="'+px.toFixed(1)+'" y="'+(h-6)+'" font-size="8" fill="#8b92a0" text-anchor="middle">'+String(yr).slice(2)+'</text>';}
  s+='</svg>';var yo=(n[n.length-1]-n[n.length-2])/n[n.length-2]*100;
  return s+'<div style="margin-top:4px;text-align:center;font-size:11px;font-weight:700;color:'+(yo>=0?'var(--green)':'var(--red)')+'">'+(yo>=0?'📈 同比上涨':'📉 同比下跌')+Math.abs(yo).toFixed(2)+'%</div>';
}

// ═══ 布林带（前端计算）═══
var BOLL_N=20,BOLL_K=2;
// 中轨=MA20；σ=sqrt(Σ(收盘−中轨)²/20)；上/下轨=中轨±2σ
function calcBoll(closes){
  if(!closes||closes.length<BOLL_N)return null;
  var win=closes.slice(-BOLL_N),ma=0,i;
  for(i=0;i<win.length;i++)ma+=win[i];ma/=BOLL_N;
  var v=0;for(i=0;i<win.length;i++)v+=(win[i]-ma)*(win[i]-ma);v/=BOLL_N;
  var sd=Math.sqrt(v),lower=ma-BOLL_K*sd,upper=ma+BOLL_K*sd,last=closes[closes.length-1];
  return{ma:ma,sd:sd,upper:upper,lower:lower,n:BOLL_N,k:BOLL_K,bars:closes.length,
    width:ma>0?(2*BOLL_K*sd/ma*100):0,
    pctB:(BOLL_K*sd)>0?((last-lower)/(2*BOLL_K*sd)*100):50};
}
// 买点区间：下沿=下轨；上沿=下轨+0.3×带宽（硬上限），MA5/MA10 落在其中则取较高者
function deriveBuyZone(boll,ma5,ma10){
  if(!boll)return null;
  var lower=boll.lower,mid=boll.ma,span=mid-lower;
  if(!(span>0))return{low:lower,high:lower,mid:mid};
  var top=lower+span*0.3;
  var cands=[ma5,ma10].filter(function(v){return v&&v>lower&&v<=top;});
  if(cands.length)top=Math.max.apply(null,cands);
  if(top>mid)top=mid;
  if(top<lower)top=lower;
  return{low:lower,high:top,mid:mid,width:top-lower};
}
function maOf(closes,p){
  if(closes.length<p)return null;
  var w=closes.slice(-p),s=0;for(var i=0;i<w.length;i++)s+=w[i];
  return s/p;
}
function txSym(mkt,code){return (String(mkt)==='1'?'sh':'sz')+code}
// 250日参数：交易日约 250 天/年
var LONG_N=250;
// 长期位置：250日均线偏离 + 250日区间分位（与布林带同源，一次请求算完）
function calcLong(rows){
  if(!rows||rows.length<LONG_N)return null;
  var win=rows.slice(-LONG_N),i,s=0;
  for(i=0;i<win.length;i++)s+=win[i].close;
  var ma=s/win.length;
  var hi=-Infinity,lo=Infinity;
  for(i=0;i<win.length;i++){
    if(win[i].high>hi)hi=win[i].high;
    if(win[i].low<lo)lo=win[i].low;
  }
  var last=rows[rows.length-1].close;
  var dev=(last/ma-1)*100;
  var pos=(hi>lo)?((last-lo)/(hi-lo)*100):50;
  return{ma:ma,ma250:ma,high:hi,low:lo,dev:dev,pos:pos,price:last,
    hiDate:win[win.length-1].date,loDate:win[0].date,bars:rows.length};
}
// 偏离度 → 定投节奏建议（阈值与页面说明严格一致）
function dcaPace(dev){
  if(dev<=-10)return{t:'加倍投',c:'#1e8449',bg:'#e8f8ee'};
  if(dev<=-3)return{t:'正常投',c:'#1e8449',bg:'#eef8f1'};
  if(dev<=5)return{t:'正常投',c:'#b8860b',bg:'#fffbe8'};
  return{t:'减半投',c:'#c0392b',bg:'#fdeeee'};
}
// 日K：腾讯前复权（qfq，与东财 fqt=1 口径一致），带内存缓存
var _klineCache={};
async function fetchCloses(mkt,code){
  var key=mkt+'.'+code;
  if(_klineCache[key]&&(Date.now()-_klineCache[key].t)<300000)return _klineCache[key].v;
  var sym=txSym(mkt,code);
  var u='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+sym+',day,,,260,qfq&_t='+Date.now();
  var r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw new Error('kline http '+r.status);
  var j=await r.json(),d=j&&j.data&&j.data[sym];
  if(!d)throw new Error('kline empty');
  var arr=d.qfqday||d.day;
  if(!arr||arr.length<BOLL_N)throw new Error('kline bars '+(arr?arr.length:0));
  var rows=arr.map(function(row){return{date:row[0],close:parseFloat(row[2]),high:parseFloat(row[3]),low:parseFloat(row[4])}});
  var closes=rows.map(function(x){return x.close});
  var v={closes:closes,rows:rows,date:arr[arr.length-1][0],source:'tencent'};
  _klineCache[key]={t:Date.now(),v:v};
  return v;
}

// ═══ 数据加载 ═══
async function fo(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f60,f162,f167,f116&invt=2&fltt=2&_t='+Date.now();
  try{var r=await fetch(u,{cache:'no-store'});if(r.ok){var j=await r.json();if(j&&j.data)return j.data}}catch(e){}
  return null;
}
async function load(){
  document.getElementById('time').textContent='⏳ 加载中...';
  var lst=active();
  if(lst.length===0){document.getElementById('time').textContent='⚠️ 请先在设置页勾选股票';return;}
  var pm=lst.map(function(c){return fo(c.mkt,c.code).then(function(raw){
    var rw={name:c.name,code:c.code,cat:c.cat,div:c.div,buy:c.buy,roe:c.roe,divHist:c.divHist,earn:c.earn,divDt:c.divDt,cfo:c.cfo,fcf:c.fcf,cov:c.cov,safe:c.safe,price:0,prev:0,chg:0,pe:0,pb:0,mcap:0,divR:0,dist:0,needy:0,ok:false,boll:null,buyZone:null,target:0,bollSrc:null,long:null};
    if(raw&&raw.f43){rw.price=raw.f43;rw.prev=raw.f60||0;rw.chg=rw.prev>0?(rw.price/rw.prev-1)*100:0;rw.pe=raw.f162||0;rw.pb=raw.f167||0;rw.mcap=(raw.f116||0)/1e8;rw.divR=c.div/rw.price*100;rw.ok=true;}
    // 并行拉日K算布林 + 250日长期位置（失败不影响行情）
    return fetchCloses(c.mkt,c.code).then(function(kr){
      var closes=kr.closes,b=calcBoll(closes);
      if(b){
        b.lastDate=kr.date;b.source=kr.source;
        var z=deriveBuyZone(b,maOf(closes,5),maOf(closes,10));
        rw.boll=b;rw.buyZone=z;
        // 布林下轨取代硬编码补仓价
        rw.target=z?z.low:c.buy;
        rw.bollSrc=kr.source;
      }else{rw.target=c.buy;}
      // 250日长期位置（需要满 250 根，不足则为空）
      var lg=calcLong(kr.rows);
      if(lg){lg.pace=dcaPace(lg.dev);rw.long=lg;}
      if(rw.ok){rw.dist=(rw.price-rw.target)/rw.target*100;rw.needy=rw.target-rw.price;}
      return rw;
    }).catch(function(){
      rw.target=c.buy;
      if(rw.ok){rw.dist=(rw.price-rw.target)/rw.target*100;rw.needy=rw.target-rw.price;}
      return rw;
    });
  }).catch(function(){return{name:c.name,code:c.code,cat:c.cat,ok:false}})});
  data=await Promise.all(pm);
  renderAll();
  var nb=0;for(var i=0;i<data.length;i++)if(data[i].boll)nb++;
  document.getElementById('time').textContent=new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})+(nb?' · 布林'+nb+'/'+data.length:'');
}
